<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Rowspan</title>
</head>

        <thead>
            <tr>
                <th>language</th>

            </tr>
            <tr>
                <td>CSS</td>
            </tr>
            <tr>
                <td>Javascript</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td rowspan="4">Graphics</td>

            </tr>
            <tr>
                <td>Canvas</td>
            </tr>
            <tr>
                <td>Illustrator</td>
            </tr>
            <tr>
                <td>VN CODE</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
